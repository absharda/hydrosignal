name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename streamsignal.html to index.html
        run: |
          git config user.name "absharda"
          git config user.email "asharda1980@gmail.com"
          git mv streamsignal.html index.html
          git commit -m "Rename streamsignal.html to index.html"
          git push
